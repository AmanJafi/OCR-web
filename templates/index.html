<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Recognition OCR</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #4f46e5;
            --primary-hover: #6366f1;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --canvas-bg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            display: flex;
            gap: 2rem;
            max-width: 960px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 320px;
            max-width: 440px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Canvas styling */
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        canvas {
            background-color: var(--canvas-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            cursor: crosshair;
            touch-action: none;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s ease;
        }

        canvas:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .slider-group input[type="range"] {
            width: 60%;
            accent-color: var(--primary-hover);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .toggle-group input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Results panel */
        .prediction-hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }

        .digit-badge {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .digit-badge.empty {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            box-shadow: none;
        }

        .pred-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .pred-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .pred-confidence {
            font-size: 1.1rem;
            font-weight: 600;
            color: #10b981;
        }

        /* Model preview */
        .preview-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            border: 1px dashed var(--card-border);
        }

        .preview-box img {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            background: #000;
            image-rendering: pixelated;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Probabilities bar chart */
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
        }

        .digit-num {
            width: 16px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: right;
        }

        .bar-wrapper {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .bar-row.top .digit-num {
            color: #10b981;
        }

        .bar-row.top .bar-fill {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
        }

        .bar-percent {
            width: 45px;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .bar-row.top .bar-percent {
            color: #10b981;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Handwritten Digit Recognition</h1>
        <p>Draw a single digit (0–9) using your mouse or touch screen</p>
    </div>

    <div class="container">
        <!-- Canvas Card -->
        <div class="card">
            <div class="card-title">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                Drawing Board
            </div>
            
            <div class="canvas-container">
                <canvas id="canvas" width="280" height="280"></canvas>

                <div class="controls">
                    <div class="slider-group">
                        <label for="strokeWidth">Brush Size: <span id="strokeVal">20px</span></label>
                        <input type="range" id="strokeWidth" min="10" max="35" value="20">
                    </div>

                    <div class="btn-group">
                        <button class="btn-secondary" id="btnClear">Clear</button>
                        <button class="btn-primary" id="btnPredict">Predict</button>
                    </div>

                    <label class="toggle-group">
                        <input type="checkbox" id="autoPredict" checked>
                        <span>Live auto-predict while drawing</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Predictions Card -->
        <div class="card">
            <div class="card-title">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                Model Predictions
            </div>

            <!-- Predicted Digit Banner -->
            <div class="prediction-hero">
                <div class="pred-info">
                    <span class="pred-label">Predicted Digit</span>
                    <span class="pred-confidence" id="confidenceVal">Draw something...</span>
                </div>
                <div class="digit-badge empty" id="digitBadge">?</div>
            </div>

            <!-- Model Input Preview -->
            <div class="preview-box">
                <img id="previewImg" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="28x28 Model Input">
                <p><strong>28x28 Centered Input</strong><br>Shows exact preprocessed image passed to ONNX model.</p>
            </div>

            <!-- Probabilities breakdown -->
            <div class="chart-container" id="chartContainer">
                <!-- Javascript will populate 0-9 bar rows -->
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const strokeWidthInput = document.getElementById('strokeWidth');
        const strokeVal = document.getElementById('strokeVal');
        const btnClear = document.getElementById('btnClear');
        const btnPredict = document.getElementById('btnPredict');
        const autoPredictCheckbox = document.getElementById('autoPredict');
        
        const digitBadge = document.getElementById('digitBadge');
        const confidenceVal = document.getElementById('confidenceVal');
        const previewImg = document.getElementById('previewImg');
        const chartContainer = document.getElementById('chartContainer');

        let isDrawing = false;
        let strokeWidth = parseInt(strokeWidthInput.value, 10);
        let debounceTimer = null;

        // Initialize canvas
        function resetCanvas() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = strokeWidth;
        }
        resetCanvas();

        // Build 0-9 probability rows
        function initChart() {
            chartContainer.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const row = document.createElement('div');
                row.className = 'bar-row';
                row.id = `bar-row-${i}`;
                row.innerHTML = `
                    <span class="digit-num">${i}</span>
                    <div class="bar-wrapper">
                        <div class="bar-fill" id="bar-fill-${i}"></div>
                    </div>
                    <span class="bar-percent" id="bar-pct-${i}">0.0%</span>
                `;
                chartContainer.appendChild(row);
            }
        }
        initChart();

        // Stroke width change
        strokeWidthInput.addEventListener('input', (e) => {
            strokeWidth = parseInt(e.target.value, 10);
            strokeVal.textContent = `${strokeWidth}px`;
            ctx.lineWidth = strokeWidth;
        });

        // Mouse & Touch events
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();

            if (autoPredictCheckbox.checked) {
                schedulePredict();
            }
        }

        function stopDrawing(e) {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
                if (autoPredictCheckbox.checked) {
                    predictDigit();
                }
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        btnClear.addEventListener('click', () => {
            resetCanvas();
            updateResults({ empty: true });
        });

        btnPredict.addEventListener('click', predictDigit);

        function schedulePredict() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(predictDigit, 150);
        }

        async function predictDigit() {
            const dataUrl = canvas.toDataURL('image/png');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });

                if (!response.ok) return;

                const result = await response.json();
                updateResults(result);
            } catch (err) {
                console.error('Prediction failed:', err);
            }
        }

        function updateResults(result) {
            if (result.empty || result.prediction === null) {
                digitBadge.textContent = '?';
                digitBadge.classList.add('empty');
                confidenceVal.textContent = 'Draw something...';
                confidenceVal.style.color = 'var(--text-muted)';
                previewImg.src = result.preview || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

                for (let i = 0; i < 10; i++) {
                    const fill = document.getElementById(`bar-fill-${i}`);
                    const pct = document.getElementById(`bar-pct-${i}`);
                    const row = document.getElementById(`bar-row-${i}`);
                    fill.style.width = '0%';
                    pct.textContent = '0.0%';
                    row.classList.remove('top');
                }
                return;
            }

            // Display top digit and confidence
            digitBadge.textContent = result.prediction;
            digitBadge.classList.remove('empty');
            confidenceVal.textContent = `Confidence: ${result.confidence}%`;
            confidenceVal.style.color = '#10b981';

            if (result.preview) {
                previewImg.src = result.preview;
            }

            // Update bar chart
            result.probabilities.forEach((prob, i) => {
                const fill = document.getElementById(`bar-fill-${i}`);
                const pct = document.getElementById(`bar-pct-${i}`);
                const row = document.getElementById(`bar-row-${i}`);

                fill.style.width = `${prob}%`;
                pct.textContent = `${prob.toFixed(1)}%`;

                if (i === result.prediction) {
                    row.classList.add('top');
                } else {
                    row.classList.remove('top');
                }
            });
        }
    </script>
</body>
</html>
